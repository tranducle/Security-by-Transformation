# Experiment Configuration Template
# Copy this file and customize for your experiment.
# API credentials are auto-loaded from .aimodel — no need to set here.

experiment:
  name: "my_experiment"                    # Tên thực nghiệm
  editable_files: ["train.py"]             # File mà AI được phép sửa
  readonly_files: ["prepare.py"]           # File chỉ đọc (context cho AI)
  run_command: "python train.py"           # Lệnh chạy thực nghiệm
  timeout_seconds: 300                     # Timeout (giây) — 5 phút mặc định
  metric_name: "val_loss"                  # Tên metric trong output
  metric_direction: "minimize"             # "minimize" hoặc "maximize"
  max_experiments: 100                     # Số thực nghiệm tối đa
  results_file: "results.tsv"             # File lưu kết quả
  work_dir: "5_Experiments_Simulations/my_experiment"  # Thư mục làm việc

ai:
  # API credentials loaded from .aimodel automatically.
  # Uncomment below to override:
  # api_key: "sk-..."
  # base_url: "https://coding-intl.dashscope.aliyuncs.com/v1"
  # model: "MiniMax-M2.5"
  max_tokens: 4096                         # Max tokens cho mỗi LLM response
  temperature: 0.7                         # Creativity level (0.0-1.0)

git:
  enabled: true                            # Dùng git để track experiments
  branch_prefix: "autoresearch"            # Prefix cho branch name
  auto_create_branch: true                 # Tự tạo branch mới

# Cấu hình phần cứng (Hardware Profile)
# "auto" = tự động phát hiện, hoặc nhập thủ công
hardware:
  gpu_name: "auto"            # "auto" hoặc tên GPU, ví dụ: "RTX 3090"
  gpu_vram_gb: 0              # 0 = tự phát hiện, hoặc nhập số GB VRAM
  ram_gb: 0                   # 0 = tự phát hiện, hoặc nhập số GB RAM
  cuda_version: "auto"        # "auto" hoặc version cụ thể, ví dụ: "12.1"
  # Giá trị mặc định nếu không phát hiện được
  default_gpu_name: "NVIDIA GeForce RTX 3090"
  default_gpu_vram_gb: 24
  default_ram_gb: 128
